<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorry Prema 🥺</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Romantic Gradient Night Sky Background */
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Moon */
    .moon {
      position: absolute;
      top: 40px;
      right: 50px;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, #fffde4, #ffe39f);
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(255, 253, 228, 0.8), 0 0 60px rgba(255, 227, 159, 0.4);
      z-index: 1;
    }

    /* Canvas for Sakura Tree & Falling Petals */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      cursor: pointer;
    }

    /* Glowing Text Overlay */
    .message-container {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .main-text {
      font-size: 3.2rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493, 0 0 30px #ff1493;
      animation: pulse 2s infinite ease-in-out;
      letter-spacing: 1.5px;
    }

    .sub-text {
      margin-top: 8px;
      font-size: 1.2rem;
      color: #ffe6f2;
      text-shadow: 0 0 8px rgba(255, 182, 193, 0.8);
      font-weight: 500;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff1493;
      }
      50% {
        transform: scale(1.05);
        text-shadow: 0 0 15px #ff69b4, 0 0 30px #ff1493, 0 0 45px #ff69b4;
      }
    }

    /* Hint text for interaction */
    .hint {
      position: absolute;
      bottom: 15px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="moon"></div>
    
    <div class="message-container">
      <div class="main-text">Sorry Prema 🥺</div>
      <div class="sub-text">মন থেকে বলছি... আর রাগ করে থেকো না ❤️</div>
    </div>

    <canvas id="canvas"></canvas>
    <div class="hint">🌸 গাছের উপরে ক্লিক করো সুন্দর পাপড়ি ঝরানোর জন্য 🌸</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Petals collection
    let petals = [];
    let fireflies = [];

    // Sakura Petal Class
    class Petal {
      constructor(x, y, speedX, speedY, size) {
        this.x = x || Math.random() * width;
        this.y = y || -10;
        this.size = size || Math.random() * 8 + 6;
        this.speedX = speedX || Math.random() * 1.5 - 0.75;
        this.speedY = speedY || Math.random() * 1.5 + 1;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.05;
        this.color = `rgba(255, ${Math.floor(150 + Math.random() * 60)}, ${Math.floor(180 + Math.random() * 50)}, ${0.7 + Math.random() * 0.3})`;
      }

      update() {
        this.x += this.speedX + Math.sin(this.y * 0.01) * 0.5;
        this.y += this.speedY;
        this.rotation += this.rotSpeed;

        if (this.y > height + 20) {
          this.y = -10;
          this.x = Math.random() * width;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        // Petal shape
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size, -this.size / 2, -this.size, this.size, 0, this.size * 1.5);
        ctx.bezierCurveTo(this.size, this.size, this.size, -this.size / 2, 0, 0);
        ctx.fill();
        ctx.restore();
      }
    }

    // Firefly Class for Romantic Atmosphere
    class Firefly {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2 + 1;
        this.alpha = Math.random();
        this.speedAlpha = 0.02;
      }

      update() {
        this.alpha += this.speedAlpha;
        if (this.alpha >= 1 || this.alpha <= 0) {
          this.speedAlpha = -this.speedAlpha;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = '#fffaaf';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#fffaaf';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // Initial Petals & Fireflies
    for (let i = 0; i < 40; i++) {
      petals.push(new Petal());
    }
    for (let i = 0; i < 25; i++) {
      fireflies.push(new Firefly());
    }

    // Draw Realistic Tree Structure (Recursive Fractal)
    function drawBranch(x, y, len, angle, branchWidth) {
      ctx.beginPath();
      ctx.save();
      ctx.lineWidth = branchWidth;
      ctx.strokeStyle = '#2c1810';
      ctx.fillStyle = '#2c1810';
      ctx.lineCap = 'round';
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -len);
      ctx.stroke();

      if (len < 10) {
        // Draw Clusters of Blossoms
        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          let blossomX = (Math.random() - 0.5) * 20;
          let blossomY = -len + (Math.random() - 0.5) * 20;
          let radius = Math.random() * 12 + 8;
          let grad = ctx.createRadialGradient(blossomX, blossomY, 0, blossomX, blossomY, radius);
          grad.addColorStop(0, 'rgba(255, 192, 203, 0.9)');
          grad.addColorStop(0.7, 'rgba(255, 105, 180, 0.6)');
          grad.addColorStop(1, 'rgba(255, 182, 193, 0)');
          ctx.fillStyle = grad;
          ctx.arc(blossomX, blossomY, radius, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
        return;
      }

      // Branching
      drawBranch(0, -len, len * 0.78, angle + 22, branchWidth * 0.7);
      drawBranch(0, -len, len * 0.78, angle - 22, branchWidth * 0.7);
      ctx.restore();
    }

    // Draw Grass Hill and Cute Cats
    function drawForeground() {
      // Hill Background
      ctx.fillStyle = '#112211';
      ctx.beginPath();
      ctx.arc(width / 2, height + 400, width > 600 ? width * 0.8 : width * 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Grass Blade details
      ctx.strokeStyle = '#1e3d1e';
      ctx.lineWidth = 2;
      for (let i = 0; i < width; i += 8) {
        ctx.beginPath();
        ctx.moveTo(i, height - 20);
        ctx.lineTo(i + (Math.random() * 10 - 5), height - 40 - Math.random() * 15);
        ctx.stroke();
      }

      // Draw Cats under tree
      drawCat(width * 0.38, height - 50, '#111111'); // Left Black Cat
      drawCat(width * 0.62, height - 50, '#f0f0f0'); // Right White Cat
    }

    function drawCat(x, y, color) {
      ctx.save();
      ctx.fillStyle = color;
      
      // Body
      ctx.beginPath();
      ctx.ellipse(x, y, 16, 22, 0, 0, Math.PI * 2);
      ctx.fill();

      // Head
      ctx.beginPath();
      ctx.arc(x, y - 24, 12, 0, Math.PI * 2);
      ctx.fill();

      // Ears
      ctx.beginPath();
      ctx.moveTo(x - 10, y - 30);
      ctx.lineTo(x - 4, y - 40);
      ctx.lineTo(x - 2, y - 30);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(x + 10, y - 30);
      ctx.lineTo(x + 4, y - 40);
      ctx.lineTo(x + 2, y - 30);
      ctx.fill();

      // Glowing Eyes
      ctx.fillStyle = '#ffe600';
      ctx.beginPath();
      ctx.arc(x - 4, y - 25, 2, 0, Math.PI * 2);
      ctx.arc(x + 4, y - 25, 2, 0, Math.PI * 2);
      ctx.fill();

      // Tail
      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x, y + 15);
      ctx.quadraticCurveTo(x + 20, y + 10, x + 15, y - 5);
      ctx.stroke();

      ctx.restore();
    }

    // Animation Loop
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // 1. Draw Foreground (Hill & Cats)
      drawForeground();

      // 2. Draw Sakura Tree
      let treeBaseX = width / 2;
      let treeBaseY = height - 40;
      let treeHeight = Math.min(height * 0.22, 130);
      drawBranch(treeBaseX, treeBaseY, treeHeight, 0, 16);

      // 3. Update & Draw Fireflies
      fireflies.forEach(f => {
        f.update();
        f.draw();
      });

      // 4. Update & Draw Petals
      petals.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();

    // Click Event: Trigger Sakura Explosion on Click!
    window.addEventListener('click', (e) => {
      let clickX = e.clientX;
      let clickY = e.clientY;

      for (let i = 0; i < 25; i++) {
        let speedX = (Math.random() - 0.5) * 6;
        let speedY = Math.random() * 3 + 1;
        petals.push(new Petal(clickX, clickY, speedX, speedY));
      }
    });
  </script>
</body>
</html>
